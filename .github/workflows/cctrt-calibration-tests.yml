name: CCTRT calibration checks

on:
  push:
    branches:
      - experiment/calibrated-cctrt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install calibration-test dependencies
        run: python -m pip install numpy pandas
      - name: Compile project Python files
        run: python -m compileall -q trfa scripts
      - name: Run calibration unit tests
        run: python -m unittest scripts.test_cctrt_calibration -v
